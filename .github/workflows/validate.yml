name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate static files
        run: python tools/validate_mod.py
      - name: Build mod package
        run: python tools/package_mod.py --output dist/inca-chanca.zip
      - uses: actions/upload-artifact@v4
        with:
          name: inca-chanca
          path: dist/inca-chanca.zip
